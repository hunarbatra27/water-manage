<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Water Quality Monitoring Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
</head>
<body>
  <!-- Alert Box for Notifications -->
  <div id="alertBox" class="alert" style="display: none;">
    <span id="alertMessage"></span>
    <button onclick="closeAlert()" class="close-btn">&times;</button>
  </div>

  <!-- Dashboard Container -->
  <div class="dashboard">
    <!-- Header Section -->
    <header class="dashboard-header">
      <h1>DASHBOARD</h1>
      <p>Real-time data for essential water parameters</p>
      <nav class="button-container">
        <a href="index.html" class="nav-button">Home</a>
        <a href="graph.html" class="nav-button">Graph</a>
        <a href="historical data.html" class="nav-button">Historical Data</a>
      </nav>
    </header>

    <!-- Grid for Cards -->
    <div class="cards-container">
      <!-- Temperature Card -->
      <div class="card temperature">
        <div class="icon">&#127777;</div>
        <h2>Temperature</h2>
        <p class="value" id="temperature">-- °C</p>
      </div>

      <!-- pH Card -->
      <div class="card ph">
        <div class="icon">&#128167;</div>
        <h2>pH Level</h2>
        <p class="value" id="ph">--</p>
      </div>

      <!-- TDS Card -->
      <div class="card tds">
        <div class="icon">&#128202;</div>
        <h2>Total Dissolved Solids</h2>
        <p class="value" id="tds">-- ppm</p>
      </div>

      <!-- Dissolved Oxygen Card -->
      <div class="card oxygen">
        <div class="icon">&#127754;</div>
        <h2>Dissolved Oxygen</h2>
        <p class="value" id="do">-- mg/L</p>
      </div>

      <!-- AI Prediction Card -->
      <div class="card ai-prediction">
        <div class="icon">&#x1F4C8;</div>
        <h2>AI Prediction</h2>
        <p class="value" id="aiPrediction">--</p>
      </div>

      <!-- Anomaly Detection Card -->
      <div class="card ai-anomalies">
        <div class="icon">&#9888;</div>
        <h2>AI Anomalies</h2>
        <p class="value" id="aiAnomalies">--</p>
      </div>
    </div>
  </div>

  <!-- Dynamic Data Update Script -->
  <script>
    const safeRanges = {
      temperature: { min: 1, max: 35 },
      ph: { min: 1, max: 8 },
      tds: { min: 10, max: 1000 },
      do: { min: 2, max: 9 },
    };

    async function fetchSensorData() {
      try {
        const response = await fetch('http://127.0.0.1:5000/sensor'); // Flask server API for sensor data
        if (!response.ok) {
          throw new Error('Failed to fetch sensor data');
        }

        const data = await response.json();
        if (data.length > 0) {
          const latestData = data[data.length - 1];

          // Update sensor data
          document.getElementById("temperature").innerText = `${latestData.temperature}°C`;
          document.getElementById("ph").innerText = latestData.ph;
          document.getElementById("tds").innerText = `${latestData.tds} ppm`;
          document.getElementById("do").innerText = `${latestData.dissolved_oxygen} mg/L`;

          // Check parameter alerts
          checkParameterAlert(latestData.temperature, 'Temperature', safeRanges.temperature, '°C');
          checkParameterAlert(latestData.ph, 'pH', safeRanges.ph, '');
          checkParameterAlert(latestData.tds, 'TDS', safeRanges.tds, 'ppm');
          checkParameterAlert(latestData.dissolved_oxygen, 'Dissolved Oxygen', safeRanges.do, 'mg/L');
        } else {
          throw new Error('No sensor data available');
        }
      } catch (error) {
        console.error('Error fetching or processing sensor data:', error);
      }
    }

    async function fetchAiPrediction() {
      try {
        const response = await fetch('http://127.0.0.1:5000/ai/predict'); // Flask server API for AI predictions
        if (!response.ok) {
          throw new Error('Failed to fetch AI predictions');
        }

        const data = await response.json();
        document.getElementById("aiPrediction").innerText = `Temperature: ${data.temperature}°C, TDS: ${data.tds} ppm, pH: ${data.ph}, DO: ${data.dissolved_oxygen} mg/L`;
      } catch (error) {
        console.error('Error fetching AI prediction:', error);
        document.getElementById("aiPrediction").innerText = 'Prediction unavailable';
      }
    }

    async function fetchAiAnomalies() {
      try {
        const response = await fetch('http://127.0.0.1:5000/ai/anomalies'); // Flask server API for anomaly detection
        if (!response.ok) {
          throw new Error('Failed to fetch AI anomalies');
        }

        const data = await response.json();
        const anomalies = Object.entries(data).map(([param, isAnomalous]) => {
          return isAnomalous ? `${param} is anomalous` : `${param} is normal`;
        }).join(', ');
        
        document.getElementById("aiAnomalies").innerText = anomalies || 'No anomalies detected';
      } catch (error) {
        console.error('Error fetching AI anomalies:', error);
        document.getElementById("aiAnomalies").innerText = 'Anomaly detection unavailable';
      }
    }

    function checkParameterAlert(value, parameter, range, unit) {
      const alertBox = document.getElementById("alertBox");
      const alertMessage = document.getElementById("alertMessage");

      if (value < range.min || value > range.max) {
        alertMessage.innerHTML = `${parameter} value (${value}${unit}) is out of range!`;
        alertBox.style.display = "block";
        setTimeout(() => alertBox.style.display = "none", 4000);
      }
    }

    function closeAlert() {
      document.getElementById("alertBox").style.display = "none";
    }

    // Fetch data periodically
    setInterval(() => {
      fetchSensorData();
      fetchAiPrediction();
      fetchAiAnomalies();
    }, 2000);

    // Initial fetch
    fetchSensorData();
    fetchAiPrediction();
    fetchAiAnomalies();
  </script>
</body>
</html>
