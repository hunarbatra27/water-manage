<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact Us</title>
  <link rel="stylesheet" href="contact us.css"> <!-- Fixed file name for CSS -->
</head>
<body>
  <!-- Header Section -->
  <header class="contact-header">
    <h1>Contact Us</h1>
    <p>Dive into Sustainability: One wave at a Time</p>
    <div class="logo">
      <img src="images/logo.jpg" alt="WaterMon Logo">
    </div>
  </header>

  <!-- Main Contact Section -->
  <section class="contact-container">
    <!-- Contact Details -->
    <div class="contact-details">
      <h2>Our Office</h2>
      <p><strong>Address:</strong>-------</p>
      <p><strong>Email:</strong> 
        <a href="mailto:hunarbatra1414@gmail.com">hunarbatra1414@gmail.com</a>
      </p>
      <p><strong>Phone:</strong>8572859545</p>
      <p><strong>Hours:</strong>------</p>
    </div>

    <!-- Contact Form -->
    <div class="contact-form">
      <form action="#" method="post">
        <div class="form-group">
          <label for="name">Your Name</label>
          <input type="text" id="name" name="name" placeholder="Enter your name" required>
        </div>
        <div class="form-group">
          <label for="email">Your Email</label>
          <input type="email" id="email" name="email" placeholder="Enter your email" required>
        </div>
        <div class="form-group">
          <label for="message">Your Message</label>
          <textarea id="message" name="message" rows="5" placeholder="Type your message here..." required></textarea>
        </div>
        <button type="submit" class="btn-submit">Send Message</button>
      </form>
    </div>
  </section>
</body>
</html>
